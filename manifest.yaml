  - configs/ruff.toml
  - languages/bash.yaml
  - languages/common.yaml
  - languages/docker.yaml
  - languages/python.yaml
  - languages/rust.yaml
  - languages/sql.yaml
  - languages/typescript.yaml
  - owner/grundsaetze.md
  - owner/grundsaetze.yaml
  - profiles/kritisch.yaml
  - profiles/produktion.yaml
  - profiles/spike.yaml
  - profiles/standard.yaml
  - schema/language.schema.json
  - schema/manifest.schema.json
  - schema/owner.schema.json
  - schema/profile.schema.json
  - schema/project.schema.json
  - schema/testing.schema.json
  - testing/standard.yaml
